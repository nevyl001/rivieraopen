version: "3.8"

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: riviera-open-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: riviera_open_test
    ports:
      - "5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./lib/data/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d riviera_open_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: riviera-open-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres-test
      ADMINER_DESIGN: nette
    depends_on:
      - postgres-test

volumes:
  postgres-test-data:
    driver: local
